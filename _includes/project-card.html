<div class="columns is-centered is-multiline is-mobile">
  {% assign projects = site.projects | sort: "date" | reverse %}
  {% for project in projects %}
    <div class="column has-text-centered is-paddingless is-marginless is-one-third-widescreen is-one-third-desktop is-one-fifth-fullhd is-one-third-tablet is-two-fifths-mobile is-three-quarters-touch"
      id="project-card">
      <a href="{{ project.url | relative_url }}">
      <div class="has-background-black card">
        <figure class="image is-3by1" style="background-image: url({{ project.post-image }});">
        </figure>
        <div class="card-content">
          <h1 class="title has-text-white is-size-4">{{ project.title }}</h1>
          <p class="has-text-white has-text-weight-light content">{{ project.description | strip | strip_html | strip_newlines | truncate: 80 }}</p>
        </div>
      </div>
      </a>
    </div>
  {% endfor %}
</div>
