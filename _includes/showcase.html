{% assign current_lang = page.lang | default: "en" %}
{% assign t = site.data.i18n[current_lang] %}
{% assign home_url = t.routes.home | relative_url %}
<section class="hero is-fullheight has-text-centered" id="hero">
  <div class="hero-body">
    <div class="container">
      <h1 class="title has-text-white is-size-1 is-uppercase has-text-weight-bold">
        {{site.title}}
      </h1>
      <h3 class="subtitle has-text-white-bis is-uppercase has-text-weight-medium is-marginless">
        {{ t.site_description }}
      </h3>
      <hr>
      <a href="{{ home_url }}#about"
        class="button is-white is-rounded is-outlined is-uppercase has-text-weight-normal">{{ t.home.read_more }}</a>
    </div>
  </div>
</section>
