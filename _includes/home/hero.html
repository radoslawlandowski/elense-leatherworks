<section class="home-hero" id="hero">
  <div class="home-hero__copy">
    <p class="eyebrow eyebrow--rule">{{ t.home.eyebrow }}</p>
    <h1 class="home-hero__title">{{ t.home.title_lead }} <em>{{ t.home.title_accent }}</em></h1>
    <p class="home-hero__intro">{{ t.home.intro }}</p>
    <div class="home-hero__actions">
      <a class="button is-primary" href="{{ t.routes.projects | relative_url }}">{{ t.home.cta_products }}</a>
      <a class="text-link" href="#about">{{ t.home.cta_studio }}</a>
    </div>
  </div>
  <div class="home-hero__media">
    <img class="home-hero__photo" src="{{ site.data.home.images.hero_main | relative_url }}" alt="{{ t.home.hero_alt_main }}" width="1365" height="2048" fetchpriority="high">
    <img class="home-hero__inset" src="{{ site.data.home.images.hero_detail | relative_url }}" alt="{{ t.home.hero_alt_detail }}" width="2048" height="1365">
  </div>
</section>
