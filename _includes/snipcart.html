{% assign snipcart_enabled = false %}
{% if site.snipcart_api_key and site.snipcart_api_key != "" %}
  {% assign snipcart_enabled = true %}
{% endif %}

{% if snipcart_enabled %}
<div hidden id="snipcart" data-api-key="{{ site.snipcart_api_key }}" data-config-modal-style="side"></div>
<script src="https://cdn.snipcart.com/themes/v3.3.1/default/snipcart.js" defer></script>
{% endif %}
