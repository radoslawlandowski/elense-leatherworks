{% comment %}
Makes product pages open instantly without downloading them in advance for everyone:
browsers that support speculation rules prefetch a product page when the visitor
hovers over or starts pressing its link.
{% endcomment %}
<script type="speculationrules">
{
  "prefetch": [
    { "where": { "href_matches": ["/pl/produkty/*", "/en/products/*"] }, "eagerness": "moderate" }
  ]
}
</script>
