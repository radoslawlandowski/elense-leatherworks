# Zdjęcia w sekcji „Instagram” (strona główna, „O pracowni”, wpisy na blogu).
# Nazwa konta pochodzi z `instagram_username` w _config.yml.
#
# Każda pozycja to jedno zdjęcie w siatce (pokazywanych jest pierwszych 6):
#   image: plik w repozytorium, np. /assets/images/instagram/2022-01-08.jpg
#   url:   link do posta na Instagramie; bez niego kafelek prowadzi do profilu
#   alt:   opis zdjęcia po polsku i angielsku
#
# Pusta lista (`posts: []`) = sekcja pokazuje sam tekst i przycisk „Obserwuj”.
#
# Po dodaniu lub podmianie zdjęcia uruchom `python3 scripts/build_images.py`
# (tworzy lżejsze kopie WebP i zapisuje wymiary w _data/images.yml).
#
# Obecny zestaw: 6 postów z największą liczbą polubień (stan na 2026-11-24),
# zdjęcia pobrane z profilu @elenseleatherworks, nazwy plików = data posta.
posts:
  - image: /assets/images/instagram/2020-05-07.jpg
    url: https://www.instagram.com/p/B_5JHaKgvPk/
    alt:
      pl: Czarna skórzana taca z pikowanym dnem i falowanymi bokami na starych deskach
      en: Black leather tray with a quilted base and curved sides on weathered planks
