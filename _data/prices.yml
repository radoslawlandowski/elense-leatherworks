# Ceny produktów — jedno miejsce dla obu wersji językowych.
# Klucz to `translation_key` produktu (ten sam w _projects/pl i _projects/en).
#
# amounts: cena w każdej walucie koszyka (pl -> PLN, en -> USD; patrz _data/i18n.yml).
#   Produkt można dodać do koszyka tylko w tym języku, w którego walucie ma cenę.
#   Puste pole = brak ceny w tej walucie = przycisk „Dodaj do koszyka” jest ukryty.
# per_piece: true dopisuje przy cenie „za sztukę”.

leather-valet-tray-organizer:
  amounts:
