    step_2: Wybierz wariant i ilość, a następnie dodaj produkt do koszyka.
    step_3: Zakończ zamówienie i potwierdź płatność.
    step_1_cart: Dodaj produkt do koszyka przyciskiem Dodaj do koszyka.
    step_2_cart: Otwórz koszyk, sprawdź pozycje i przejdź do checkout.
