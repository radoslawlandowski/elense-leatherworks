    care_heading: Materiał i Pielęgnacja
    default_care: Skóra naturalna z czasem nabiera charakteru. Czyść suchą lub lekko wilgotną ściereczką, unikaj długiego kontaktu z wilgocią i okresowo stosuj balsam do skóry.
    default_faq:
      - question: Czy produkt jest wykonany ze skóry naturalnej?
        answer: Tak. Każdy egzemplarz szyjemy ręcznie ze skóry naturalnej dobranej pod kątem trwałości i komfortu codziennego użytkowania.
      - question: Czy mogę zamówić personalizację?
        answer: Tak. Wybrane produkty możemy personalizować. Napisz do nas przed zamówieniem, aby potwierdzić dostępne opcje.
      - question: Ile trwa realizacja i wysyłka?
        answer: Produkty dostępne od ręki wysyłamy szybko. Produkty na zamówienie wymagają kilku dni roboczych na wykonanie przed wysyłką.
    default_features:
      - Ręczne wykonanie z naturalnej skóry.
      - Trwałe wykończenie i dbałość o detal.
      - Projekt dopasowany do codziennego użycia.
    default_warranty: Produkt objęty jest 12-miesięczną gwarancją na wykonanie. W przypadku wady produkcyjnej zapewniamy naprawę lub wymianę.
