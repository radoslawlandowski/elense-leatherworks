markdown: kramdown

# URL of the Site
url: "https://www.elenseleatherworks.com"
# Base URL of the Site (i.e., Name of the Repository in which the Site is hosted)
baseurl: 

# Title of the Site
title: Elense Leatherworks
# Description of the Site
description: Handmade leather home decor accessories crafted in Poland for everyday rituals.
# URL of Image of the Site
site-image: /assets/images/meta.jpg
# Keywords of the Site
site-keywords: skorzane akcesoria, leather home decor, elense experience, recznie szyte, home decor, skora naturalna, codzienne rytualy
# URL for the Image of custom Favicon
favicon-url: 

# URL of the Image of Custom Hero Image (i.e., the image in the background of the very first section of the Homepage)
heroimage: /assets/images/meta.jpg

# Social Media and Contact
# If you don't want to use any icon, you can leave them blank.
email: "radoslaw.landowski@gmail.com"
whatsapp_number: "889815275"
whatsapp_url: ""
shopify_store_url: ""
snipcart_api_key: "MDQ1YzJmMGEtMzIzMi00YjM3LThkNzQtMGJjNDZlNWY1ZTU4NjM5MDgyNDgxODQyNjEwMDQ2"
instagram_username: "elenseleatherworks"
linkedin_username: ""
youtube_channel_id: ""

# Google Analytics
google-analytics: ""
google-site-verification: ""
bing-site-verification: ""

# Name of the Author
author-name: Radosław Landowski
# URL for the Image of the Author
author-image: /assets/images/logo.png
# 60 Words About the Author
author-about: Founder, designer and crafter in Elense Leatherworks.
author-about-pl: Twórca, projektant i rzemieślnik Elense Leatherworks.
# URL to the Author's Profile (i.e., Github, Twitter, Stackoverflow, etc)
author-url: ""

# SASS
sass:
  sass_dir: _sass
  style: compressed

# Build settings
plugins:
  - jekyll-admin
  - jekyll-feed

collections:
  projects:
    output: true

# Permalink
permalink: "blog/:title"

# Compress
compress_html:
  clippings: all

# Defaults
defaults:
  -
    scope:
      type: 'posts'
    values:
      layout: post
      post-image: ""
      description: ""
      tags:
        - ""
  -
    scope:
      path: "_posts/en"
      type: 'posts'
    values:
      lang: en
  -
    scope:
      path: "_posts/pl"
      type: 'posts'
    values:
      lang: pl
  -
    scope:
      type: 'projects'
    values:
      layout: project-product
      post-image: ""
      description: ""
      tags:
        - ""
  -
    scope:
      path: "_projects/en"
      type: 'projects'
    values:
      lang: en
  -
    scope:
      path: "_projects/pl"
      type: 'projects'
    values:
      lang: pl
  -
    scope:
      type: 'pages'
    values:
      layout: page
      lang: en

# Exclude
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
