# WhatATheme
markdown: kramdown

# URL of the Site
url: '' # Set your production domain, e.g. https://example.com
# Base URL of the Site (i.e., Name of the Repository in which the Site is hosted)
baseurl: 

# Title of the Site
title: Elense Leatherworks
# Description of the Site
description: Handmade leather home decor accessories crafted in Poland for everyday rituals.
# URL of Image of the Site
site-image: /assets/images/meta.jpg
# Keywords of the Site
site-keywords: skorzane akcesoria, leather home decor, elense experience, recznie szyte, home decor, skora naturalna, codzienne rytualy
# URL for the Image of custom Favicon
favicon-url: 

# URL of the Image of Custom Hero Image (i.e., the image in the background of the very first section of the Homepage)
heroimage: https://images.pexels.com/photos/220444/pexels-photo-220444.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940

# Social Media and Contact
# If you don't want to use any icon, you can leave them blank.
email: thedevslot@gmail.com
shopify_store_url: https://shopify.com
instagram_username: thedevslot
linkedin_username: thedevslot
youtube_channel_id: UCk_93NXYP-U_AOB5GfWlOow

# Google Analytics
google-analytics: ""
google-site-verification: ""
bing-site-verification: ""

# Name of the Author
author-name: Radosław Landowski
# URL for the Image of the Author
author-image: https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png
# 60 Words About the Author
author-about: Founder of Elense Leatherworks, creating handcrafted leather accessories for home decor, built around quality, personalization, and everyday comfort.
author-about-pl: Twórca Elense Leatherworks. Projektuję ręcznie wykonane akcesoria skórzane do home decor, oparte na jakości, personalizacji i komforcie codziennego użytkowania.
# URL to the Author's Profile (i.e., Github, Twitter, Stackoverflow, etc)
author-url: https://github.com/thedevslot

# SASS
sass:
  sass_dir: _sass
  style: compressed

# Build settings
plugins:
  - jekyll-admin
  - jekyll-feed

collections:
  projects:
    output: true

# Permalink
permalink: "blog/:title"

# Compress
compress_html:
  clippings: all

# Defaults
defaults:
  -
    scope:
      type: 'posts'
    values:
      layout: post
      post-image: ""
      description: ""
      tags:
        - ""
  -
    scope:
      path: "_posts/en"
      type: 'posts'
    values:
      lang: en
  -
    scope:
      path: "_posts/pl"
      type: 'posts'
    values:
      lang: pl
  -
    scope:
      type: 'projects'
    values:
      layout: project-product
      post-image: ""
      description: ""
      tags:
        - ""
  -
    scope:
      path: "_projects/en"
      type: 'projects'
    values:
      lang: en
  -
    scope:
      path: "_projects/pl"
      type: 'projects'
    values:
      lang: pl
  -
    scope:
      type: 'pages'
    values:
      layout: page
      lang: en

# Exclude
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
