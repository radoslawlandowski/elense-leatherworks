<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Skora garbowana roslinnie vs chromowo</title>
  <desc id="desc">Ilustracja porownujaca dwa typy skory: roslinna i chromowa.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1e7d6" />
      <stop offset="100%" stop-color="#d3b089" />
    </linearGradient>
    <linearGradient id="leftPanel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5e34" />
      <stop offset="100%" stop-color="#5f3c22" />
    </linearGradient>
    <linearGradient id="rightPanel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6d4f3a" />
      <stop offset="100%" stop-color="#4a3427" />
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)" />
  <rect x="130" y="160" width="430" height="560" rx="28" fill="url(#leftPanel)" />
  <rect x="640" y="160" width="430" height="560" rx="28" fill="url(#rightPanel)" />

  <rect x="180" y="250" width="330" height="16" rx="8" fill="#f2e2cc" opacity="0.9" />
  <rect x="180" y="290" width="280" height="16" rx="8" fill="#f2e2cc" opacity="0.75" />
  <rect x="180" y="330" width="310" height="16" rx="8" fill="#f2e2cc" opacity="0.6" />

  <rect x="690" y="250" width="330" height="16" rx="8" fill="#ead7be" opacity="0.9" />
  <rect x="690" y="290" width="280" height="16" rx="8" fill="#ead7be" opacity="0.75" />
  <rect x="690" y="330" width="310" height="16" rx="8" fill="#ead7be" opacity="0.6" />

  <text x="195" y="220" fill="#fff3e2" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700">
    Roslinnie
  </text>
  <text x="705" y="220" fill="#fff3e2" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700">
    Chromowo
  </text>

  <text x="120" y="95" fill="#4f3524" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700">
