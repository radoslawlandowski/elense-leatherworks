  <circle cx="255" cy="535" r="8" fill="#efd7bb" />
  <circle cx="330" cy="520" r="8" fill="#efd7bb" />
  <circle cx="405" cy="525" r="8" fill="#efd7bb" />
  <circle cx="540" cy="580" r="8" fill="#efd7bb" />
  <circle cx="640" cy="558" r="8" fill="#efd7bb" />
