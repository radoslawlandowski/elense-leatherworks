    <text x="519" y="395">Rzemioslo</text>
    <text x="824" y="395">Ergonomia</text>
  </g>

  <path d="M190 560 C 310 505, 430 505, 550 560" fill="none" stroke="#efd7bb" stroke-width="9" stroke-linecap="round" />
