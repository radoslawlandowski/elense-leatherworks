<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Dlaczego Elense</title>
  <desc id="desc">Grafika hero akcentujaca detale, rzemioslo i ergonomie.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#efe3d0" />
      <stop offset="100%" stop-color="#cda47a" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6d4529" />
      <stop offset="100%" stop-color="#402717" />
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)" />
  <rect x="110" y="120" width="980" height="660" rx="30" fill="url(#card)" />

  <text x="170" y="240" fill="#f5e8d8" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="700">
    Dlaczego Elense?
  </text>

  <g fill="#efd7bb">
