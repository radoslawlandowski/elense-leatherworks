---
layout: compress
---
{% assign current_lang = page.lang | default: "en" %}
{% assign t = site.data.i18n[current_lang] %}
{% assign home_url = t.routes.home | default: "/" %}

<!DOCTYPE html>
<html lang="{{ current_lang }}">
{% include head.html %}

<body>
    <section class="hero is-fullheight has-text-centered has-background-black-ter">
        <div class="hero-body">
            <div class="container">
                <h1 class="title is-1 is-uppercase has-text-weight-bold has-text-white">
                    {{page.title}}
                </h1>
                <h3 class="is-uppercase has-text-weight-medium is-marginless has-text-grey-light">
                    {{content}}
                </h3>
                <hr>
                <div class="columns is-marginless is-inline-flex-desktop">
                    <a href="{{ home_url | relative_url }}"
                        class="button is-white column is-rounded is-outlined is-uppercase has-text-weight-normal">{{ t.nav.home }}</a>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
